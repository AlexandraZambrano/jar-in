# Static serving for the Jars PWA. See docs/DEPLOYMENT.md.
#
#  - SPA fallback: every unknown path resolves to /index.html so client
#    routes work on a hard refresh.
#  - Hashed build assets (/assets/*) are immutable → cache forever.
#  - index.html, the service worker and the manifest must revalidate every
#    time so a new deploy is picked up immediately.

server {
    # IPv4 only — Coolify's reverse proxy reaches the container over IPv4,
    # and `listen [::]:80` fails on hosts with IPv6 disabled in Docker.
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't leak nginx version.
    server_tokens off;

    # gzip (brotli isn't in the stock image)
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── Hashed build output — safe to cache immutably ──────────────────
    #    /assets/*  and the content-hashed  workbox-<hash>.js
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~ ^/workbox-[^/]+\.js$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Service worker & PWA plumbing — always revalidate ──────────────
    location = /sw.js         { add_header Cache-Control "no-cache" always; }
    location = /registerSW.js { add_header Cache-Control "no-cache" always; }
    location = /manifest.webmanifest {
        # stock mime.types has no .webmanifest mapping
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # ── Non-hashed static (icons, favicon, fonts) — a modest cache ─────
    location ~* \.(?:png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── The app shell + SPA fallback — never cache the HTML ────────────
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
