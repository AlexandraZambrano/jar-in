<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF6E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17131F" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jars" />
    <meta
      name="description"
      content="Track your money with your own jars and percentages. Local-first, offline, open source."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap"
    />
    <title>Jars</title>
    <script>
      // Apply saved appearance before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('jarin.preferences') || '{}');
        var root = document.documentElement;
        root.dataset.theme = p.theme || 'system';
        root.dataset.a11y = Array.isArray(p.a11y) ? p.a11y.join(' ') : '';
      } catch (e) {
        /* first run / storage blocked — defaults are fine */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
